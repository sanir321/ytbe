name: Daily GTA6_DS Shorts Publish

on:
  schedule:
    # Slot 1: 09:00 UTC (14:30 IST) - European afternoon & Indian midday peak
    - cron: '0 9 * * *'
    # Slot 2: 15:30 UTC (21:00 IST) - US morning & Indian evening peak
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Day number to publish (or "auto" for next queued)'
        required: false
        default: 'auto'
      privacy:
        description: 'YouTube privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow yt-dlp

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Changes
        run: |
          git pull --rebase origin master || true

      - name: Run GTA6_DS Publisher
        env:
          GTA6_YT_CLIENT_ID: ${{ secrets.GTA6_YT_CLIENT_ID }}
          GTA6_YT_CLIENT_SECRET: ${{ secrets.GTA6_YT_CLIENT_SECRET }}
          GTA6_YT_REFRESH_TOKEN: ${{ secrets.GTA6_YT_REFRESH_TOKEN }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          DAY_ARG="${{ github.event.inputs.day || 'auto' }}"
          PRIVACY_ARG="${{ github.event.inputs.privacy || 'public' }}"
          python3 publish_gta6.py --day "$DAY_ARG" --privacy "$PRIVACY_ARG"

      - name: Commit & Push Updated Manifest
        run: |
          git add manifest_gta6.json
          git commit -m "chore(gta6): update manifest_gta6.json [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Push failed, continuing..."
