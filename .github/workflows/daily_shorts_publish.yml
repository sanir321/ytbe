name: Daily Shorts Publisher

on:
  schedule:
    # Runs daily at 18:00 UTC (prime viral engagement window)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Specific Day to Publish (1-28) or "auto" for next queued'
        required: true
        default: 'auto'
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry run (verify file & pipeline without uploading)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Publisher
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          CMD="python publish.py"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --day ${{ inputs.day }} --privacy ${{ inputs.privacy }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
          else
            CMD="$CMD --day auto --privacy public"
          fi
          
          echo "Running: $CMD"
          eval $CMD
