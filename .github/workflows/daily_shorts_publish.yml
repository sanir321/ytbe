name: Daily Shorts Publisher (YouTube & Rumble)

on:
  schedule:
    # Evening viral publication & boost (18:00 UTC = 23:30 IST prime viral window)
    - cron: '0 18 * * *'
    # Morning drip boost for all active videos (06:00 UTC = 11:30 IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Specific Day to Publish (1-28) or "auto" for next queued'
        required: true
        default: 'auto'
      platform:
        description: 'Target Platform (all, youtube, or rumble)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - rumble
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry run (verify file & pipeline without uploading)'
        required: true
        default: false
        type: boolean
      boost_count:
        description: 'Views per video for AWS Cloud Boost'
        required: true
        default: '300'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Publisher & Cloud Booster
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RUMBLE_COOKIES_JSON: ${{ secrets.RUMBLE_COOKIES_JSON }}
          GITHUB_ACTIONS: 'true'
        run: |
          CMD="python publish.py"
          
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            CMD="python publish.py --day boost-only --boost-count 150"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --day ${{ inputs.day }} --platform ${{ inputs.platform }} --privacy ${{ inputs.privacy }} --boost-count ${{ inputs.boost_count }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
          else
            CMD="$CMD --day auto --platform all --privacy public --boost-count 300"
          fi
          
          echo "Running: $CMD"
          eval $CMD
