name: SH SARKAR Daily Shorts Publisher (Free Fire)

on:
  schedule:
    # Slot 1: 06:30 UTC = 12:00 IST / 12:15 NPT (Lunchtime Free Fire gaming peak)
    - cron: '30 6 * * *'
    # Slot 2: 12:30 UTC = 18:00 IST / 18:15 NPT (Evening Free Fire gaming peak)
    - cron: '30 12 * * *'
    # Fallback retry slots (automatically throttled if already 2 published today)
    - cron: '15 7 * * *'
    - cron: '15 13 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action (publish or delete)'
        required: true
        default: 'publish'
        type: choice
        options:
          - publish
          - delete
      day:
        description: 'Specific Day to Publish (1-330) or "auto"'
        required: false
        default: 'auto'
      count:
        description: 'Number of videos to publish (1 or 2)'
        required: false
        default: '1'
      delete_id:
        description: 'YouTube Video ID to delete (if action is delete)'
        required: false
        default: ''
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry Run (verify without uploading)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish_sarkar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Multimedia & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute SH SARKAR Daily Publisher
        env:
          SARKAR_YT_CLIENT_ID: ${{ secrets.SARKAR_YT_CLIENT_ID }}
          SARKAR_YT_CLIENT_SECRET: ${{ secrets.SARKAR_YT_CLIENT_SECRET }}
          SARKAR_YT_REFRESH_TOKEN: ${{ secrets.SARKAR_YT_REFRESH_TOKEN }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          GITHUB_ACTIONS: 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.action }}" = "delete" ] && [ -n "${{ inputs.delete_id }}" ]; then
              CMD="python publish_sarkar.py --delete '${{ inputs.delete_id }}'"
            else
              CMD="python publish_sarkar.py --day '${{ inputs.day }}' --count '${{ inputs.count }}' --privacy '${{ inputs.privacy }}'"
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                CMD="$CMD --dry-run"
              fi
            fi
          else
            CMD="python publish_sarkar.py --day auto --count 1 --privacy public"
          fi
          
          echo "Executing: $CMD"
          eval $CMD
