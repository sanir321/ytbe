name: SH SARKAR Daily Shorts Publisher (Free Fire)

'on':
  schedule:
    # 11:15 UTC = 16:45 IST / 17:00 NPT (Off-zero minute to avoid GitHub Actions cron delays)
    - cron: '15 11 * * *'
    # Backup retry slot (auto-skipped if already published today)
    - cron: '45 12 * * *'

  workflow_dispatch:
    inputs:
      day:
        description: 'Specific Day to Publish (1-330) or "auto"'
        required: true
        default: 'auto'
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry Run (verify without uploading)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish_sarkar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Multimedia & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute SH SARKAR Daily Publisher
        env:
          SARKAR_YT_CLIENT_ID: ${{ secrets.SARKAR_YT_CLIENT_ID }}
          SARKAR_YT_CLIENT_SECRET: ${{ secrets.SARKAR_YT_CLIENT_SECRET }}
          SARKAR_YT_REFRESH_TOKEN: ${{ secrets.SARKAR_YT_REFRESH_TOKEN }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          GITHUB_ACTIONS: 'true'
        run: |
          CMD="python publish_sarkar.py"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --day ${{ inputs.day }} --privacy ${{ inputs.privacy }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
          else
            CMD="$CMD --day auto --privacy public"
          fi
          
          echo "Executing: $CMD"
          eval $CMD
